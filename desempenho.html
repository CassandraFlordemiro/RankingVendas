<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desempenho Individual - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .analytics-container {
            width: 100%;
            max-width: 1150px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .analytics-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--admin-card-bg);
            border: 1px solid var(--admin-border);
            padding: 14px 20px;
            border-radius: 12px;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .btn-voltar:hover {
            transform: scale(1.03);
            border-color: var(--box-border-hover);
        }

        .split-layout {
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 20px;
        }

        @media (max-width: 950px) {
            .split-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Coluna Lateral: Perfil e Filtros */
        .profile-card {
            background: var(--admin-card-bg);
            border: 1px solid var(--admin-border);
            border-radius: 14px;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            height: fit-content;
        }

        .profile-avatar-lg {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--box-border-hover);
        }

        .profile-placeholder-lg {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #ff4d00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
        }

        /* Badge da Posição Mensal Geral no Perfil */
        .badge-posicao-mensal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            color: var(--text-main);
        }

        .filter-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-top: 6px;
            padding-top: 14px;
            border-top: 1px solid var(--box-border);
        }

        .filter-label {
            font-size: 0.74rem;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .select-custom {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid var(--box-border);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .select-destaque-consultor {
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            background-color: #10b981;
            color: #ffffff;
        }

        .select-destaque-consultor:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .select-destaque-consultor option {
            background-color: var(--sidebar-bg);
            color: var(--text-main);
            font-weight: 600;
        }

        body.theme-dracula .select-destaque-consultor {
            background-color: #bd93f9;
            color: #21222c;
            box-shadow: 0 4px 16px rgba(189, 147, 249, 0.35);
        }

        body.theme-light .select-destaque-consultor {
            background-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.28);
        }

        body.theme-refuturiza .select-destaque-consultor {
            background-color: #ff4d00;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 77, 0, 0.32);
        }

        /* Painel Analítico da Direita */
        .analytics-main {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* Grid de KPIs em 4 colunas */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        @media (max-width: 760px) {
            .kpi-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .kpi-card {
            background: var(--admin-card-bg);
            border: 1px solid var(--admin-border);
            border-radius: 12px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: transform 0.2s ease;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
        }

        /* Estilização Card: Melhor Fechamento */
        .kpi-card-melhor {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, var(--admin-card-bg) 100%);
            border: 1px solid rgba(34, 197, 94, 0.45);
        }

        .kpi-card-melhor .kpi-title {
            color: #4ade80;
        }

        .kpi-card-melhor .kpi-value {
            color: #22c55e;
        }

        /* Estilização Card: Pior Fechamento */
        .kpi-card-pior {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.14) 0%, var(--admin-card-bg) 100%);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .kpi-card-pior .kpi-title {
            color: #f87171;
        }

        .kpi-card-pior .kpi-value {
            color: #ef4444;
        }

        .kpi-title {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .chart-card {
            background: var(--admin-card-bg);
            border: 1px solid var(--admin-border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 310px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-header h3 {
            font-size: 1.02rem;
            color: var(--text-main);
        }

        .btn-toggle-group {
            display: flex;
            background: var(--box-bg);
            border: 1px solid var(--box-border);
            border-radius: 8px;
            padding: 2px;
        }

        .btn-toggle {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-toggle.active {
            background: #3b82f6;
            color: #ffffff;
        }

        body.theme-refuturiza .btn-toggle.active {
            background: #ff4d00;
        }
    </style>
</head>
<body>
    <div class="analytics-container">
        
        <header class="analytics-header-bar">
            <a href="admin.html?abrir=usuarios" class="btn-voltar">
                <span>‹</span>
                <span>Voltar ao Gerenciamento</span>
            </a>
            <h2 style="font-size: 1.15rem; font-weight: 700; color: var(--text-main);">Dashboard de Desempenho</h2>
            <button id="btn-exportar-consultor" class="btn-acao-modal btn-acao-editar" style="padding: 8px 14px; display: flex; align-items: center; gap: 6px;">
                📥 Exportar CSV
            </button>
        </header>

        <main class="split-layout">
            <aside class="profile-card">
                <div id="box-avatar">
                    <div class="profile-placeholder-lg" id="consultor-avatar-placeholder">?</div>
                    <img id="consultor-avatar-img" src="" alt="Foto" class="profile-avatar-lg" style="display: none;">
                </div>
                
                <div>
                    <h3 id="consultor-nome-display" style="font-size: 1.2rem; font-weight: 700; color: var(--text-main);">Carregando...</h3>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Consultor(a) de Vendas</p>
                    
                    <!-- Posição Mensal Geral -->
                    <div id="badge-posicao-container" class="badge-posicao-mensal">
                        <!-- Preenchido dinamicamente com medalha ou posição -->
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="select-consultor">SELECIONAR CONSULTOR</label>
                    <select id="select-consultor" class="select-custom select-destaque-consultor">
                        <!-- Preenchido dinamicamente -->
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label" for="select-mes">MÊS DE REFERÊNCIA</label>
                    <select id="select-mes" class="select-custom">
                        <option value="2026-08">Agosto / 2026</option>
                        <option value="2026-07">Julho / 2026</option>
                        <option value="2026-06">Junho / 2026</option>
                    </select>
                </div>
            </aside>

            <section class="analytics-main">
                <!-- Grid de 4 KPIs -->
                <div class="kpi-row">
                    <div class="kpi-card">
                        <span class="kpi-title">Total no Período</span>
                        <span class="kpi-value" id="kpi-total-vendas">0</span>
                    </div>
                    <div class="kpi-card">
                        <span class="kpi-title">Média por Ciclo</span>
                        <span class="kpi-value" id="kpi-media-vendas">0.0</span>
                    </div>
                    <div class="kpi-card kpi-card-melhor">
                        <span class="kpi-title">Melhor Fechamento</span>
                        <span class="kpi-value" id="kpi-melhor-dia" style="font-size: 1.25rem;">-</span>
                    </div>
                    <div class="kpi-card kpi-card-pior">
                        <span class="kpi-title">Pior Fechamento</span>
                        <span class="kpi-value" id="kpi-pior-dia" style="font-size: 1.25rem;">-</span>
                    </div>
                </div>

                <!-- Gráfico 1: Volume de Vendas -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h3>Volume de Vendas Diárias</h3>
                        <div class="btn-toggle-group">
                            <button class="btn-toggle active" id="btn-chart-bar">Barras</button>
                            <button class="btn-toggle" id="btn-chart-line">Linhas</button>
                        </div>
                    </div>
                    <div style="position: relative; flex: 1; width: 100%; min-height: 220px;">
                        <canvas id="meuGrafico"></canvas>
                    </div>
                </div>

                <!-- Gráfico 2: Posição no Ranking -->
                <div class="chart-card">
                    <div class="chart-header">
                        <h3>Evolução de Posição no Ranking Diário</h3>
                        <span style="font-size: 0.74rem; color: var(--text-muted); font-weight: 600;">(1º Lugar no topo)</span>
                    </div>
                    <div style="position: relative; flex: 1; width: 100%; min-height: 220px;">
                        <canvas id="graficoPosicoes"></canvas>
                    </div>
                </div>
            </section>
        </main>

    </div>

    <script type="module" src="desempenho.js"></script>
</body>
</html>
