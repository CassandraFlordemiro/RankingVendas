<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel de Controle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ranking-container" style="max-width: 380px;">
        <div class="header" style="justify-content: center;">
            <h2>Acesso Restrito</h2>
        </div>
        
        <form id="form-login" style="display: flex; flex-direction: column; gap: 14px;">
            <div>
                <label for="email" style="font-size: 0.78rem; color: #94a3b8; display: block; margin-bottom: 6px;">E-mail:</label>
                <input type="email" id="email" required placeholder="supervisora@exemplo.com" style="padding: 11px; width: 100%; border-radius: 8px; border: 1px solid #334155; outline: none; background: #0f172a; color: #f8fafc; font-size: 0.9rem;">
            </div>

            <div>
                <label for="senha" style="font-size: 0.78rem; color: #94a3b8; display: block; margin-bottom: 6px;">Senha:</label>
                <input type="password" id="senha" required placeholder="••••••••" style="padding: 11px; width: 100%; border-radius: 8px; border: 1px solid #334155; outline: none; background: #0f172a; color: #f8fafc; font-size: 0.9rem;">
            </div>

            <div id="msg-erro" style="color: #f87171; font-size: 0.8rem; display: none; text-align: center;"></div>

            <button type="submit" id="btn-entrar" style="padding: 12px; width: 100%; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; margin-top: 6px; transition: background 0.2s ease;">Entrar no Painel</button>
        </form>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
