<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso Seguro - Ranking Vendas</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="theme-dracula login-body">

  <div class="login-page-wrapper">
    <div class="login-glass-card">
      
      <div class="login-header-area">
        <div class="login-brand-icon">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <h2>Ranking<span>Vendas</span></h2>
        <p class="login-subtitle">Gestão Comercial, Performance & Pós-Venda</p>
      </div>

      <form id="formLogin" class="login-form mt-4">
        <div class="form-group">
          <label for="loginEmail"><i class="fa-solid fa-envelope"></i> E-mail de Acesso</label>
          <input type="email" id="loginEmail" required placeholder="seu.usuario@empresa.com" autocomplete="username" />
        </div>

        <div class="form-group">
          <div class="label-row-split">
            <label for="loginSenha"><i class="fa-solid fa-lock"></i> Senha</label>
            <span class="forgot-link" onclick="recuperarSenha()">Esqueceu?</span>
          </div>
          <div class="password-input-wrap">
            <input type="password" id="loginSenha" required placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="btn-toggle-pass" id="btnToggleSenha">
              <i class="fa-solid fa-eye" id="iconEye"></i>
            </button>
          </div>
        </div>

        <div class="form-group-checkbox">
          <label class="remember-checkbox">
            <input type="checkbox" id="checkLembrar" checked />
            <span>Manter conectado neste navegador</span>
          </label>
        </div>

        <div id="loginErroMsg" class="login-alert-error" style="display: none;">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="txtLoginErro">E-mail ou senha inválidos.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-login-submit mt-3" id="btnLoginSubmit">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
        </button>
      </form>

      <div class="login-footer-info">
        <div class="theme-selector-login">
          <span>Tema:</span>
          <select id="seletorTemaLogin" onchange="aplicarTema(this.value)">
            <option value="dracula">Dracula</option>
            <option value="midnight">Midnight</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="light">Light</option>
          </select>
        </div>
        <small>© 2026 RankingVendas • Todos os direitos reservados</small>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
